version: "3"

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install required tools with Homebrew
    sources: [Brewfile]
    generates: [Brewfile.lock.json]
    cmds:
      - brew bundle
    platforms: [darwin]

  dev:
    desc: Start development server with draft and future content
    deps: [setup]
    cmds:
      - hugo server -D -F --disableFastRender --baseURL http://localhost:1313/

  build:
    desc: Build site for production
    deps: [setup]
    sources:
      - hugo.yaml
      - content/**/*
      - static/**/*
      - layouts/**/*
      - archetypes/**/*
    generates:
      - public/**/*
    cmds:
      - hugo --gc --minify --panicOnWarning

  deploy:
    desc: Build and deploy by hand (Workers Builds deploys every push to main)
    cmds:
      # wrangler.jsonc's build.command validates and builds before uploading.
      - |
        if token=$(security find-generic-password -s cloudflare-api-token -w 2>/dev/null); then
          export CLOUDFLARE_API_TOKEN="$token"
        fi
        bunx wrangler deploy

  links:
    desc: Check external links and anchors in public/ (run task build first)
    cmds:
      - lychee --cache --max-cache-age 2d --root-dir "$PWD/public" --include-fragments --no-progress 'public/**/*.html'

  clean:
    desc: Clean up generated files
    cmds:
      - rm -rf public resources

  check:
    desc: Check content and links
    deps: [setup]
    cmds:
      - hugo --renderToMemory --panicOnWarning

  new:
    desc: Create a new content file
    deps: [setup]
    cmds:
      - hugo new {{.CLI_ARGS}}
    silent: true

  new:post:
    desc: Create a new blog post
    deps: [setup]
    cmds:
      - hugo new posts/{{.CLI_ARGS}}.md
    silent: true

  format:
    desc: Format code using Prettier (excluding Hugo templates)
    cmds:
      - prettier --write .

  optimize-images:
    desc: Optimize PNG and JPEG images in static/
    deps: [setup]
    cmds:
      - |
        echo "Optimizing PNG images..."
        find static -name "*.png" -exec pngquant --force --ext .png --quality=65-80 {} \;
        echo "Optimizing JPEG images..."
        find static \( -name "*.jpg" -o -name "*.jpeg" \) -exec mogrify -strip -interlace Plane -quality 85 {} \;
        echo "Image optimization complete."
