baseURL: https://philoserf.com/
locale: en-us
title: Mark Ayers
enableGitInfo: true
enableRobotsTXT: true
taxonomies: {} # intentionally empty to disable tags and categories

params:
  author: "Mark Ayers"
  since: 2005
  description: "Short, plain, unhedged essays on thinking and cognition, civilization, and identity — with poetry, story, and the small crafts of attention: coffee, calendars, kitchens, and code."
  email: "mark@philoserf.com"
  # The Latin motto — home page, About page, and the vCard NOTE field.
  motto: "COGITA·DISCE·NECTE·FARE"
  nickname: "philoserf"
  # Warm-paper background hexes; must match --background-color in static/style.css
  themeColor:
    light: "#faf7f1"
    dark: "#201d18"

  home:
    headline: "Uncompressed public thinking"
    startHereIntro: "Essays that say what the rest is trying to do."
    featured:
      - pageRef: /posts/agency-without-a-self-or-free-will
      - pageRef: /posts/moral-circles-contract-under-scarcity-and-threat
    startHere:
      - pageRef: /posts/two-latin-mottos-as-inner-and-outer-epistemic-loops
      - pageRef: /posts/why-feynman-and-watts-lectures-still-resonate
      - pageRef: /posts/the-wheel-turns-an-old-man-and-his-son-by-the-river
      - pageRef: /posts/the-republic-as-something-each-generation-must-keep

  contact:
    givenName: "Mark"
    familyName: "Ayers"
    birthday: "19620704"
    phone: "+12062804061"
    timezone: "America/Detroit"
    address:
      street: "160 Rollingwood Dr"
      city: "Rockford"
      region: "MI"
      postalCode: "49341"
      country: "United States"

  social:
    github: "https://github.com/philoserf"
    mastodon: "https://pkm.social/@philoserf"

menus:
  main:
    - name: About
      pageRef: /about
      weight: 10
      params:
        description: Who the author is
    - name: Now
      pageRef: /now
      weight: 20
      params:
        description: Current focus
    - name: Uses
      pageRef: /uses
      weight: 30
      params:
        description: Tools and setup
    - name: Posts
      pageRef: /posts
      weight: 40
      params:
        description: Index of all posts
        llmsSection: writing

mediaTypes:
  application/manifest+json:
    suffixes: [webmanifest]
  text/vcard:
    suffixes: [vcf]

outputFormats:
  llms:
    name: llms
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  manifest:
    name: manifest
    mediaType: application/manifest+json
    baseName: site
    isPlainText: true
    notAlternative: true
  vcard:
    name: vcard
    mediaType: text/vcard
    baseName: vcard
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - html
    - rss
    - llms
    - manifest
    - vcard
