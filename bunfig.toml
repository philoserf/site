[fmt]
# Leave code in Markdown fences alone: a fenced snippet is quoted, and
# formatting it would change what it quotes.
embeddedLanguageFormatting = "off"
ignorePatterns = [
  # Build output
  "public/**",
  "resources/**",

  # Publisher-generated posts — read-only output, overwritten on next publish
  "content/posts/**",

  # Hugo templates — bun fmt cannot parse Hugo template syntax
  "layouts/**",
  "archetypes/**",
]
